# Migration Journal Integrity Check
#
# Validates that Drizzle (or any jq-parseable) migration journal stays consistent.
#
# HOW TO CUSTOMIZE:
#   Set JOURNAL_DIR in the env block below to match your project structure.
#   Examples:
#     src/db/migrations        (default — Drizzle monolith)
#     packages/db/migrations   (monorepo package)
#     backend/migrations       (flat backend layout)
#
# The journal file is always resolved as $JOURNAL_DIR/meta/_journal.json

name: Migrations Check

on:
  push:
    branches:
      - test
      - main
  pull_request:
    branches:
      - test
      - main

env:
  JOURNAL_DIR: src/db/migrations   # <-- change this for your project layout

jobs:
  migrations-check:
    name: Validate migration journal integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so we can compare against the base branch
          fetch-depth: 0

      # ---------------------------------------------------------------
      # CHECK 1: Every tag in _journal.json must have a matching SQL file.
      # Catches: journal entry added but migration file was deleted or
      # never committed.
      # ---------------------------------------------------------------
      - name: Check every journal tag has a matching SQL file
        run: |
          JOURNAL="$JOURNAL_DIR/meta/_journal.json"

          if [ ! -f "$JOURNAL" ]; then
            echo "ERROR: Journal file not found at $JOURNAL"
            exit 1
          fi

          # Fail loudly on malformed JSON — otherwise jq dies inside the
          # process substitution, the loop never runs, and the check
          # passes silently.
          if ! jq empty "$JOURNAL" 2>/dev/null; then
            echo "ERROR: $JOURNAL is not valid JSON."
            exit 1
          fi

          missing=0
          while IFS= read -r tag; do
            sql_file="$JOURNAL_DIR/$tag.sql"
            if [ ! -f "$sql_file" ]; then
              echo "MISSING SQL: $sql_file (tag '$tag' is in journal but file does not exist)"
              missing=$((missing + 1))
            fi
          done < <(jq -r '.entries[].tag' "$JOURNAL")

          if [ "$missing" -gt 0 ]; then
            echo "ERROR: $missing journal tag(s) have no corresponding SQL file."
            exit 1
          fi

          echo "OK: All journal tags have matching SQL files."

      # ---------------------------------------------------------------
      # CHECK 2: Every numbered SQL file must appear in the journal.
      # Catches: migration file added to the directory but the journal
      # was not updated (e.g. hand-crafted SQL dropped in without
      # running drizzle-kit generate).
      # ---------------------------------------------------------------
      - name: Check every numbered SQL file appears in journal
        run: |
          JOURNAL="$JOURNAL_DIR/meta/_journal.json"

          untracked=0
          for sql_file in "$JOURNAL_DIR"/[0-9]*.sql; do
            # Glob returns the literal pattern when no files match — skip that case
            [ -f "$sql_file" ] || continue

            tag=$(basename "$sql_file" .sql)
            match=$(jq -r --arg tag "$tag" '.entries[] | select(.tag == $tag) | .tag' "$JOURNAL")

            if [ -z "$match" ]; then
              echo "UNTRACKED SQL: $sql_file (no journal entry for tag '$tag')"
              untracked=$((untracked + 1))
            fi
          done

          if [ "$untracked" -gt 0 ]; then
            echo "ERROR: $untracked SQL file(s) are not recorded in the journal."
            exit 1
          fi

          echo "OK: All numbered SQL files are recorded in the journal."

      # ---------------------------------------------------------------
      # CHECK 3: Journal must not regress vs the pre-change state.
      # Catches: squashed or rebased branches that silently drop
      # migration entries that already exist on the base, which would
      # corrupt deployed databases.
      #
      # PRs compare against the target branch; direct pushes compare
      # against the pre-push tip (github.event.before) — comparing
      # against origin/<branch> after a push is a no-op because the
      # remote ref already points at the pushed commit.
      # ---------------------------------------------------------------
      - name: Check journal does not regress vs base
        run: |
          JOURNAL="$JOURNAL_DIR/meta/_journal.json"

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_BRANCH="${{ github.base_ref }}"
            git fetch origin "$BASE_BRANCH" --depth=1 2>/dev/null || true
            BASE_REF="origin/$BASE_BRANCH"
          else
            # Direct push: the pre-push tip of this branch
            BASE_REF="${{ github.event.before }}"
            if [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
              echo "INFO: New branch push — no pre-push state to compare. Skipping."
              exit 0
            fi
          fi

          # Read tags from the base version of the journal (may not
          # exist on brand-new repos — skip gracefully in that case)
          BASE_JOURNAL=$(git show "$BASE_REF:$JOURNAL_DIR/meta/_journal.json" 2>/dev/null || echo "")

          if [ -z "$BASE_JOURNAL" ]; then
            echo "INFO: No journal found at $BASE_REF — skipping regression check."
            exit 0
          fi

          regressed=0
          while IFS= read -r tag; do
            match=$(jq -r --arg tag "$tag" '.entries[] | select(.tag == $tag) | .tag' "$JOURNAL")
            if [ -z "$match" ]; then
              echo "REGRESSION: tag '$tag' exists at $BASE_REF but is missing from the current branch."
              regressed=$((regressed + 1))
            fi
          done < <(echo "$BASE_JOURNAL" | jq -r '.entries[].tag')

          if [ "$regressed" -gt 0 ]; then
            echo "ERROR: $regressed migration tag(s) were removed compared to $BASE_REF."
            echo "Removing applied migrations from the journal breaks deployed databases."
            exit 1
          fi

          echo "OK: Journal does not regress vs $BASE_REF."

      # ---------------------------------------------------------------
      # CHECK 4: Journal "when" timestamps must be strictly increasing.
      # Catches: hand-edited or rewritten journal entries with stale
      # "when" values. drizzle-orm only applies entries whose "when" is
      # greater than the newest applied timestamp — an out-of-order
      # entry is silently skipped on every deploy, forever, while
      # drizzle-kit still prints "migrations applied successfully".
      # ---------------------------------------------------------------
      - name: Check journal "when" timestamps are monotonic
        run: |
          JOURNAL="$JOURNAL_DIR/meta/_journal.json"

          NON_MONOTONIC=$(jq '[.entries[].when] as $w
            | [range(1; $w | length) | select($w[.] <= $w[. - 1])] | length' "$JOURNAL")

          if [ "$NON_MONOTONIC" -gt 0 ]; then
            echo "ERROR: $NON_MONOTONIC journal entr(y/ies) have a \"when\" <= the previous entry's."
            echo "drizzle-orm silently skips out-of-order entries — they will NEVER be applied."
            echo "Fix: bump the stale \"when\" to a value greater than every earlier entry."
            jq -r '.entries[] | "\(.idx)\t\(.when)\t\(.tag)"' "$JOURNAL"
            exit 1
          fi

          echo "OK: Journal \"when\" timestamps are strictly increasing."

      # ---------------------------------------------------------------
      # CHECK 5: No statement-breakpoint token inside SQL comments.
      # Catches: explanatory comments that mention drizzle's breakpoint
      # marker literally. The migration splitter is comment-blind — it
      # splits on the token even inside a comment, tearing the file
      # into invalid SQL fragments and aborting the deploy with a
      # generic "PRE_RUN_HOOK failed".
      # ---------------------------------------------------------------
      - name: Check no breakpoint token inside SQL comments
        run: |
          bad=0
          for sql_file in "$JOURNAL_DIR"/[0-9]*.sql; do
            [ -f "$sql_file" ] || continue

            # A legitimate marker line starts with the token itself.
            # Flag lines where comment text precedes the token.
            if grep -nE -e '--[^>].*--> statement-breakpoint' -e '/\*.*--> statement-breakpoint' "$sql_file"; then
              echo "COMMENT-EMBEDDED TOKEN in $sql_file (lines above)"
              bad=$((bad + 1))
            fi
          done

          if [ "$bad" -gt 0 ]; then
            echo "ERROR: $bad file(s) mention the breakpoint token inside a comment."
            echo "The splitter is comment-blind and will split there. Paraphrase the token instead."
            exit 1
          fi

          echo "OK: No breakpoint tokens inside comments."
